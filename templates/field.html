{% extends "base.html" %}
{% block title %}Add Field - FTI{% endblock %}
{% block content %}

<h1 style="font-size:20px; margin-bottom:16px;">Add Field</h1>

<form method="POST" action="/add-field" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Farm</label>
        <select name="farm_id" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            <option value="">Select farm</option>
            {% for farm in farms %}
            <option value="{{ farm.farm_id }}">{{ farm.farm_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Field Name</label>
        <input type="text" name="field_name" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Area (acres)</label>
        <input type="number" step="0.1" name="area_acres" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Soil Type</label>
        <input type="text" name="soil_type" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:18px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Notes</label>
        <textarea name="notes" rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
    </div>

    <button type="submit" class="btn" style="width:100%;">Add Field</button>
</form>

{% endblock %}
