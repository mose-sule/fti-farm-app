{% extends "base.html" %}
{% block title %}Edit Harvest - FTI{% endblock %}
{% block content %}

<h1 style="font-size:20px; margin-bottom:16px;">Edit Harvest</h1>

<form method="POST" action="/edit-harvest/{{ harvest.harvest_id }}" class="card">
    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Farm</label>
        <select name="farm_id" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            {% for farm in farms %}
            <option value="{{ farm.farm_id }}" {% if farm.farm_id == harvest.farm_id %}selected{% endif %}>{{ farm.farm_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Crop Name</label>
        <input type="text" name="crop_name" value="{{ harvest.crop_name }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Harvest Date</label>
        <input type="date" name="harvest_date" value="{{ harvest.harvest_date }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Quantity</label>
            <input type="number" step="0.1" name="quantity" value="{{ harvest.quantity }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Unit</label>
            <input type="text" name="unit" value="{{ harvest.unit }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Quality</label>
        <select name="quality" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            {% for option in ["Excellent", "Good", "Fair", "Poor"] %}
            <option value="{{ option }}" {% if option == harvest.quality %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:18px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Notes</label>
        <textarea name="notes" rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">{{ harvest.notes }}</textarea>
    </div>

    <button type="submit" class="btn" style="width:100%;">Save Changes</button>
</form>

{% endblock %}
