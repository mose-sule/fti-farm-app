{% extends "base.html" %}
{% block title %}Edit Field - FTI{% endblock %}
{% block content %}

<h1 style="font-size:20px; margin-bottom:16px;">Edit Field</h1>

<form method="POST" action="/edit-field/{{ field.field_id }}" class="card">
    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Farm</label>
        <select name="farm_id" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            {% for farm in farms %}
            <option value="{{ farm.farm_id }}" {% if farm.farm_id == field.farm_id %}selected{% endif %}>{{ farm.farm_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Field Name</label>
        <input type="text" name="field_name" value="{{ field.field_name }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Area (acres)</label>
        <input type="number" step="0.1" name="area_acres" value="{{ field.area_acres }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Soil Type</label>
        <input type="text" name="soil_type" value="{{ field.soil_type }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:18px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Notes</label>
        <textarea name="notes" rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">{{ field.notes }}</textarea>
    </div>

    <button type="submit" class="btn" style="width:100%;">Save Changes</button>
</form>

{% endblock %}
