{% extends "base.html" %}
{% block title %}Edit Soil Test - FTI{% endblock %}
{% block content %}

<h1 style="font-size:20px; margin-bottom:16px;">Edit Soil Test</h1>

<form method="POST" action="/edit-soil-test/{{ test.test_id }}" class="card">
    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Farm</label>
        <select name="farm_id" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            {% for farm in farms %}
            <option value="{{ farm.farm_id }}" {% if farm.farm_id == test.farm_id %}selected{% endif %}>{{ farm.farm_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Test Date</label>
        <input type="date" name="test_date" value="{{ test.test_date }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Soil Type</label>
        <input type="text" name="soil_type" value="{{ test.soil_type }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">pH</label>
            <input type="number" step="0.1" name="ph" value="{{ test.ph }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Moisture (%)</label>
            <input type="number" step="0.1" name="moisture" value="{{ test.moisture }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Nitrogen (ppm)</label>
            <input type="number" step="0.1" name="nitrogen" value="{{ test.nitrogen }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Phosphorus (ppm)</label>
            <input type="number" step="0.1" name="phosphorus" value="{{ test.phosphorus }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Potassium (ppm)</label>
            <input type="number" step="0.1" name="potassium" value="{{ test.potassium }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
        <div>
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Organic Matter (%)</label>
            <input type="number" step="0.1" name="organic_matter" value="{{ test.organic_matter }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
        </div>
    </div>

    <div style="margin-bottom:18px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Notes</label>
        <textarea name="notes" rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">{{ test.notes }}</textarea>
    </div>

    <button type="submit" class="btn" style="width:100%;">Save Changes</button>
</form>

{% endblock %}
