{% extends "base.html" %}
{% block title %}Edit Crop - FTI{% endblock %}
{% block content %}

<h1 style="font-size:20px; margin-bottom:16px;">Edit Crop</h1>

<form method="POST" action="/edit-crop/{{ crop.crop_id }}" class="card">
    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Farm</label>
        <select name="farm_id" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            {% for farm in farms %}
            <option value="{{ farm.farm_id }}" {% if farm.farm_id == crop.farm_id %}selected{% endif %}>{{ farm.farm_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Field</label>
        <select name="field_id" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            {% for field in fields %}
            <option value="{{ field.field_id }}" {% if field.field_id == crop.field_id %}selected{% endif %}>{{ field.field_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Crop Name</label>
        <input type="text" name="crop_name" value="{{ crop.crop_name }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Variety</label>
        <input type="text" name="variety" value="{{ crop.variety }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Planting Date</label>
        <input type="date" name="planting_date" value="{{ crop.planting_date }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Expected Harvest Date</label>
        <input type="date" name="expected_harvest_date" value="{{ crop.expected_harvest_date }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Area (acres)</label>
        <input type="number" step="0.1" name="area_acres" value="{{ crop.area_acres }}" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
    </div>

    <div style="margin-bottom:18px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Status</label>
        <select name="status" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
            <option value="growing" {% if crop.status == "growing" %}selected{% endif %}>Growing</option>
            <option value="harvested" {% if crop.status == "harvested" %}selected{% endif %}>Harvested</option>
            <option value="failed" {% if crop.status == "failed" %}selected{% endif %}>Failed</option>
        </select>
    </div>

    <button type="submit" class="btn" style="width:100%;">Save Changes</button>
</form>

{% endblock %}
