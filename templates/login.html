<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTI - Farm Tech Intelligence</title>
    <meta name="description" content="FTI helps farmers track crops, fields, harvests, and soil health, with weather alerts and local market oversupply insights to plan smarter.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <style>
        html, body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(20,60,25,0.55), rgba(20,60,25,0.8)), url('/static/images/hero-tractor.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .login-page { display:flex; flex-direction:column; min-height:100vh; }
        .login-header { padding:40px 22px 0; text-align:center; }
        .login-title { font-size:26px; font-weight:700; color:white; letter-spacing:0.5px; }
        .login-tagline { font-size:12px; color:#dceedb; margin-top:2px; }
        .login-badges { display:flex; flex-direction:column; gap:8px; margin-top:18px; align-items:center; }
        .login-badge { background:rgba(255,255,255,0.14); border-radius:999px; padding:7px 14px; font-size:12px; color:white; display:inline-flex; align-items:center; gap:7px; }
        .login-badge i { font-size:14px; color:#c0dd97; }
        .login-spacer { flex:1; min-height:16px; }
        .login-card { background:white; border-radius:24px 24px 0 0; padding:26px 24px 32px; box-shadow:0 -4px 20px rgba(0,0,0,0.1); }
        .login-card h2 { font-size:16px; font-weight:600; margin:0 0 16px; }
        .auth-field { margin-bottom:14px; }
        .auth-field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
        .auth-field input { width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; }
        .btn-gold { display:block; width:100%; background:#D99A2B; color:#3a2a05; border:none; border-radius:999px; padding:12px; font-weight:700; font-size:15px; text-align:center; cursor:pointer; }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-header">
        <div class="login-title">FTI</div>
        <div class="login-tagline">Farm Tech Intelligence</div>
        <div class="login-badges">
            <div class="login-badge"><i class="ti ti-leaf"></i>Crop &amp; harvest tracking</div>
            <div class="login-badge"><i class="ti ti-chart-bar"></i>Local market insights</div>
            <div class="login-badge"><i class="ti ti-cloud-storm"></i>Weather-based alerts</div>
        </div>
    </div>

    <div class="login-spacer"></div>

    <div class="login-card">

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flashes">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <h2>Welcome back</h2>
        <form method="POST" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="auth-field">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="auth-field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-gold">Log In</button>
        </form>
        <p style="text-align:center; margin-top:16px; font-size:13px; color:#666;">
            Don't have an account? <a href="/signup" style="color:#2f7a3f; font-weight:600;">Sign up</a>
        </p>

    </div>
</div>

</body>
</html>
